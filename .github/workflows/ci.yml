name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (client and server)
        run: npm run check

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build:client

      - name: Build server bundle
        run: npm run build:server

      # The packaged app shipped broken while every check above was green: the
      # native module was unreachable inside the asar and the app hung on start.
      # Packaging is the only check that would have caught it.
      - name: Package the desktop app
        run: npx electron-builder --dir --linux

      - name: Confirm the packaged app starts and serves
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          HOME="$(mktemp -d)" xvfb-run -a ./dist-electron/linux-unpacked/athena-ai-desktop --no-sandbox > packaged-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "the packaged app is serving"
              # Whether the database's checkpointer thread runs inside the
              # packaged app (it loads better-sqlite3 from the asar in a
              # worker thread): the app says so, either way, on start-up.
              sleep 3
              echo "--- the packaged app's database lines:"
              grep -F "[db]" packaged-app.log || echo "(no [db] line: the checkpointer said nothing within 3 s)"
              exit 0
            fi
            sleep 1
          done
          echo "the packaged app did not serve within 60 seconds"
          cat packaged-app.log
          exit 1

  # The dashboard is run on Windows as well, so the paths that matter most there
  # run there: the install (better-sqlite3 is a native module), the type check,
  # the tests for ending the dev server's process tree (taskkill, by its full
  # path) and for a Stop reaching the engine, and the test files that remove the
  # SQLite files they used (Windows refuses to remove a file that is still open).
  # Not the whole suite and not the packaged build, which stay on the Linux job
  # above.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # --foreground-scripts shows whether better-sqlite3 came from a prebuilt
      # binary (prebuild-install) or was compiled (node-gyp).
      - name: Install dependencies
        run: npm ci --foreground-scripts

      - name: Check that better-sqlite3 loads
        run: node -p "new (require('better-sqlite3'))(':memory:').prepare('select sqlite_version() as v').get().v"

      - name: Typecheck (client and server)
        run: npm run check

      # What `npm test` runs first (its pretest).
      - name: Build better-sqlite3 for Node
        run: npm run rebuild:node

      - name: Stop-path tests, the process-tree tests and the tests that remove their SQLite files
        run: >-
          node scripts/test.mjs
          tests/a-stop-goes-on-no-connection-the-engine-is-closing-and-follows-a-redirect.test.ts
          tests/a-stop-is-mirrored-to-the-backend-record-after-its-answer.test.ts
          tests/a-failed-write-never-holds-back-or-hides-a-stop.test.ts
          tests/a-stop-goes-first-and-a-retest-verdict-is-never-lost.test.ts
          tests/a-retest-files-only-a-verdict-and-its-stop-waits-on-nothing.test.ts
          tests/a-retest-verdict-survives-a-restart-and-is-filed-once.test.ts
          tests/the-kill-switch-never-blocks-another-stop.test.ts
          tests/the-kill-switch-sends-stops-only-to-runs-that-may-be-running.test.ts
          tests/deleting-a-running-scan-stops-it-first.test.ts
          tests/every-scan-starts-through-the-backend-and-its-stop-stays-direct.test.ts
          tests/a-scan-no-stop-can-reach-is-marked-failsafe-and-deleted-only-with-force.test.ts
          tests/a-stop-reaches-the-engine-while-the-database-is-locked.test.ts
          tests/a-write-flood-under-a-held-lock-delays-no-stop-and-writes-nothing-twice.test.ts
          tests/an-api-key-stop-waits-on-no-write-and-no-start-passes-a-pressed-kill-switch.test.ts
          tests/a-tests-table-at-estate-scale-never-delays-a-stop.test.ts
          tests/a-sign-in-flood-never-delays-a-stop.test.ts
          tests/scans.test.ts
          tests/the-dev-server-and-everything-it-started-end-when-the-app-quits.test.ts
          tests/closing-the-database-releases-its-file-and-the-next-query-opens-it-again.test.ts
          tests/taskkill-is-run-by-its-full-path-under-the-system-root.test.ts
          tests/the-helper-that-removes-sqlite-files-never-swallows-a-file-still-held.test.ts
          tests/a-backend-record-is-collected-once-across-a-restart.test.ts
          tests/a-database-holding-two-checks-for-one-run-still-opens.test.ts
          tests/a-sign-in-on-an-old-hash-never-writes-over-a-changed-password.test.ts
          tests/first-run-seeds-no-known-password-and-a-legacy-default-must-be-changed.test.ts
          tests/no-statement-waits-on-the-lock-and-another-dashboards-change-is-honoured.test.ts
          tests/two-sign-ins-at-once-on-a-legacy-hash-both-get-in.test.ts
